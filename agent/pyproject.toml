[project]
name = "dataops-agent"
version = "0.1.0"
description = "AI DataOps Intelligence agent: discovery, collectors, buffer, push"
requires-python = ">=3.10"
dependencies = ["httpx", "PyYAML", "psycopg[binary]"]

[project.scripts]
dataops-agent = "agent.main:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["agent*"]
